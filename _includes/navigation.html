<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ site.avatar | relative_url }}" alt="" width="28" height="28" class="brand__logo">
      <span class="brand__name">{{ site.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.navigation -%}
      {%- assign active = false -%}
      {%- if page.url == item.link or item.link == '/' and page.layout == 'post' -%}{%- assign active = true -%}{%- endif %}
      <a href="{{ item.link | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
